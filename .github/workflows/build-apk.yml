name: Build MelkYab APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Fetch high-resolution Tehran night background from Pexels
        run: |
          python3 - <<'PY'
          import base64, urllib.request
          from pathlib import Path
          image_url = 'https://images.pexels.com/photos/3799150/pexels-photo-3799150.jpeg?auto=compress&cs=tinysrgb&w=2400&h=4267&fit=crop'
          request = urllib.request.Request(image_url, headers={'User-Agent': 'Mozilla/5.0 (compatible; MelkYabBuild/1.0)'})
          with urllib.request.urlopen(request, timeout=60) as response:
              image = response.read()
              content_type = response.headers.get('Content-Type', '')
          if len(image) < 100_000 or len(image) > 20_000_000:
              raise SystemExit(f'Unexpected image size: {len(image)} bytes')
          if not image.startswith(b'\\xff\\xd8\\xff'):
              raise SystemExit(f'Download did not return JPEG (Content-Type: {content_type})')
          target = Path('app/src/main/assets/home_city_header.jpg.b64')
          target.write_text(base64.b64encode(image).decode('ascii'))
          print(f'Pexels Tehran night background fetched: {len(image)} bytes; {content_type}')
          PY
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MelkYab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
