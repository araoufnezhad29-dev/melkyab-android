name: Build MelkYab APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Fetch approved Unsplash night city background
        env:
          PHOTO_PAGE: https://unsplash.com/photos/city-skyline-with-illuminated-skyscrapers-at-night-y1aJw1VMJ54
        run: |
          python3 - <<'PY'
          import base64, html, re, urllib.request
          from pathlib import Path
          page = urllib.request.Request(
              __import__('os').environ['PHOTO_PAGE'],
              headers={'User-Agent': 'Mozilla/5.0 (compatible; MelkYabBuild/1.0)'}
          )
          with urllib.request.urlopen(page, timeout=30) as r:
              document = r.read().decode('utf-8', 'replace')
          match = re.search(r'<meta[^>]+property=["\\']og:image["\\'][^>]+content=["\\']([^"\\']+)', document, re.I)
          if not match:
              match = re.search(r'<meta[^>]+content=["\\']([^"\\']+)["\\'][^>]+property=["\\']og:image["\\']', document, re.I)
          if not match:
              raise SystemExit('Unsplash og:image metadata was not found')
          image_url = html.unescape(match.group(1))
          request = urllib.request.Request(image_url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(request, timeout=60) as r:
              image = r.read()
              content_type = r.headers.get('Content-Type', '')
          if len(image) < 100_000 or len(image) > 20_000_000:
              raise SystemExit(f'Unexpected image size: {len(image)} bytes')
          if not (image.startswith(b'\\xff\\xd8\\xff') or image.startswith(b'\\x89PNG\\r\\n\\x1a\\n') or image[:4] == b'RIFF'):
              raise SystemExit(f'Download did not return a recognized image (Content-Type: {content_type})')
          target = Path('app/src/main/assets/home_city_header.jpg.b64')
          target.write_text(base64.b64encode(image).decode('ascii'))
          print(f'Background fetched successfully: {len(image)} bytes; content-type={content_type}')
          PY
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MelkYab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
